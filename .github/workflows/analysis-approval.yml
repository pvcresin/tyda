name: Analysis approval
run-name: >-
  ${{ github.event.label.name == 'approved-analysis-change' &&
  format('Analysis approval ({0})', github.event.action) ||
  'Ignored label change' }}

# The approved-analysis-change label only re-runs the analysis checks. This workflow
# reports only the analysis-compatibility gate, so a label change never replaces the
# test, performance, or other results of the Pull request CI run for the same commit.
on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: analysis-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: resolve approval
    if: github.event.label.name == 'approved-analysis-change'
    runs-on: ubuntu-latest
    outputs:
      analysis_approved: ${{ steps.approval.outputs.analysis_approved }}
    steps:
      - name: Resolve analysis-change approval
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          approved=0
          if [[ "$EVENT_ACTION" == labeled ]]; then
            permission="$(gh api \
              "repos/$GITHUB_REPOSITORY/collaborators/$SENDER_LOGIN/permission" \
              --jq .permission 2>/dev/null || true)"
            case "$permission" in
              admin|maintain)
                approved=1
                ;;
              *)
                echo "Ignoring approved-analysis-change from $SENDER_LOGIN (permission=$permission)."
                ;;
            esac
          fi
          echo "analysis_approved=$approved" >> "$GITHUB_OUTPUT"

  # Pull request CI already built the binaries for this commit. Reuse them when they
  # match the exact base and head revisions, so the label run does not wait for a
  # rebuild.
  runtime:
    name: find analysis build
    if: github.event.label.name == 'approved-analysis-change'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.verify.outputs.run_id }}
      artifact_id: ${{ steps.verify.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find Pull request CI build
        id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/find-analysis-runtime.sh

      - name: Download Pull request CI build
        if: steps.find.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.find.outputs.artifact_id }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: target/analysis-runtime

      - name: Verify build revisions
        id: verify
        if: steps.find.outputs.artifact_id != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.find.outputs.artifact_id }}
        run: |
          metadata=target/analysis-runtime/metadata
          if [[ -f "$metadata" &&
                -f target/analysis-runtime/bin/base/tyda &&
                -f target/analysis-runtime/bin/head/tyda &&
                "$(sed -n 's/^base_sha=//p' "$metadata")" == "$BASE_SHA" &&
                "$(sed -n 's/^head_sha=//p' "$metadata")" == "$HEAD_SHA" ]]; then
            echo "Reusing analysis build from Pull request CI run $RUN_ID."
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "The Pull request CI build does not match $BASE_SHA...$HEAD_SHA; building again."
          fi

  analysis-build:
    needs: [changes, runtime]
    if: needs.runtime.outputs.artifact_id == ''
    uses: ./.github/workflows/analysis-compatibility.yml
    with:
      phase: build
    permissions:
      contents: read

  analysis-subjects:
    needs: [changes, runtime, analysis-build]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.runtime.result == 'success' &&
      (needs.analysis-build.result == 'success' ||
       (needs.analysis-build.result == 'skipped' && needs.runtime.outputs.artifact_id != ''))
    uses: ./.github/workflows/analysis-compatibility.yml
    with:
      phase: subjects
      analysis_approved: ${{ needs.changes.outputs.analysis_approved == '1' }}
      runtime_run_id: ${{ needs.runtime.outputs.run_id }}
      runtime_artifact_id: ${{ needs.runtime.outputs.artifact_id }}
    permissions:
      actions: read
      contents: read

  analysis-compatibility:
    # Other labels must not report a skipped analysis-compatibility check, because a
    # skipped required check counts as passing.
    name: >-
      ${{ github.event.label.name == 'approved-analysis-change' &&
      'analysis-compatibility' || 'ignored label change' }}
    needs: [changes, runtime, analysis-build, analysis-subjects]
    if: always() && github.event.label.name == 'approved-analysis-change'
    runs-on: ubuntu-latest
    steps:
      - name: Require analysis workflows
        env:
          BUILD_RESULT: ${{ needs.analysis-build.result }}
          SUBJECTS_RESULT: ${{ needs.analysis-subjects.result }}
          REUSED_ARTIFACT: ${{ needs.runtime.outputs.artifact_id }}
        run: |
          if [[ -n "$REUSED_ARTIFACT" ]]; then
            [[ "$BUILD_RESULT" == skipped && "$SUBJECTS_RESULT" == success ]]
          else
            [[ "$BUILD_RESULT" == success && "$SUBJECTS_RESULT" == success ]]
          fi
