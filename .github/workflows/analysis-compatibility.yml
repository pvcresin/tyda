name: Analysis compatibility

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      phase:
        description: Which part of the compatibility check to run.
        required: false
        type: string
        default: all
      analysis_approved:
        description: Whether a maintainer approved the analysis output and coverage changes.
        required: false
        type: boolean
        default: false
    outputs:
      run_analysis:
        description: Whether the changed files require analysis compatibility checks.
        value: ${{ jobs.changes.outputs.run_analysis }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: analysis-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      run_analysis: ${{ steps.paths.outputs.run_analysis }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: bash scripts/ci/classify-changed-paths.sh

  build:
    name: analysis-build
    needs: changes
    if: >-
      (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'build') &&
      needs.changes.outputs.run_analysis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: clang libclang-dev

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: rust

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          shared-key: analysis-compatibility-v2

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Build base/head compatibility binaries
        env:
          TYDA_COMPAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TYDA_COMPAT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/build_compatibility_binaries.sh target/analysis-runtime

      - name: Export comparison revisions
        id: revisions
        run: |
          metadata=target/analysis-runtime/metadata
          base_sha="$(sed -n 's/^base_sha=//p' "$metadata")"
          head_sha="$(sed -n 's/^head_sha=//p' "$metadata")"
          test -n "$base_sha"
          test -n "$head_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Upload compatibility runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-compatibility-runtime
          path: target/analysis-runtime
          if-no-files-found: error

  analysis:
    needs:
      - changes
      - build
    if: >-
      always() &&
      needs.changes.outputs.run_analysis == 'true' &&
      (
        inputs.phase == 'subjects' ||
        (
          (inputs.phase == '' || inputs.phase == 'all') &&
          needs.build.result == 'success'
        )
      )
    name: analysis (${{ matrix.subject }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - subject: sample
            subject_path: subject/sample
            timeout_seconds: 60
          - subject: rack
            subject_path: subject/rack
            timeout_seconds: 60
          - subject: rake
            subject_path: subject/rake
            timeout_seconds: 60
          - subject: optcarrot
            subject_path: subject/optcarrot
            timeout_seconds: 60
          - subject: typeprof
            subject_path: subject/typeprof/lib
            timeout_seconds: 180
          - subject: rubygems
            subject_path: subject/rubygems
            timeout_seconds: 180
          - subject: conference-app
            subject_path: subject/conference-app
            timeout_seconds: 180
          - subject: redmine
            subject_path: subject/redmine
            timeout_seconds: 180
          - subject: rubygems.org
            subject_path: subject/rubygems.org
            timeout_seconds: 180
          - subject: mastodon
            subject_path: subject/mastodon
            timeout_seconds: 180
          - subject: gitlab
            subject_path: subject/gitlab/app
            timeout_seconds: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: "3.4"

      - name: Download compatibility runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-compatibility-runtime
          path: target/analysis-runtime

      - name: Cache analysis subject
        if: matrix.subject != 'sample'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: subject/${{ matrix.subject }}
          key: ${{ runner.os }}-analysis-subject-${{ matrix.subject }}-${{ hashFiles('scripts/setup_subjects.sh') }}

      - name: Prepare pinned analysis subject
        if: matrix.subject != 'sample'
        run: ./scripts/setup_subjects.sh "${{ matrix.subject }}"

      - name: Compare analysis output and coverage
        env:
          TYDA_ANALYSIS_APPROVED: ${{ inputs.analysis_approved && '1' || '0' }}
          TYDA_ANALYSIS_BINARY_DIR: ${{ github.workspace }}/target/analysis-runtime/bin
          TYDA_ANALYSIS_BASE_RBS_DIR: ${{ github.workspace }}/target/analysis-runtime/rbs/base
          TYDA_ANALYSIS_HEAD_RBS_DIR: ${{ github.workspace }}/target/analysis-runtime/rbs/head
          TYDA_ANALYSIS_OUTPUT_DIR: ${{ github.workspace }}/target/analysis/${{ matrix.subject }}
          TYDA_ANALYSIS_SUBJECT_NAME: ${{ matrix.subject }}
          TYDA_ANALYSIS_SUBJECT_PATH: ${{ github.workspace }}/${{ matrix.subject_path }}
          TYDA_ANALYSIS_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          TYDA_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TYDA_COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TYDA_COVERAGE_THREADS: "2"
          TYDA_COVERAGE_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          TYDA_COVERAGE_ALLOW_BASE_TIMEOUT: "0"
          TYDA_COVERAGE_ALLOW_REGRESSIONS: ${{ inputs.analysis_approved && '1' || '0' }}
        run: ./scripts/run_analysis_compatibility.sh

      - name: Upload analysis comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-comparison-${{ matrix.subject }}
          path: target/analysis/${{ matrix.subject }}
          if-no-files-found: warn

  analysis-compatibility:
    name: analysis-compatibility
    needs:
      - changes
      - build
      - analysis
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require compatibility checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run_analysis }}
          PHASE: ${{ inputs.phase }}
          BUILD_RESULT: ${{ needs.build.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
        run: |
          case "$PHASE" in
            build)
              REQUIRED_RESULTS="analysis-build=$BUILD_RESULT"
              ;;
            subjects)
              REQUIRED_RESULTS="analysis=$ANALYSIS_RESULT"
              ;;
            *)
              REQUIRED_RESULTS=$'analysis-build='"$BUILD_RESULT"$'\nanalysis='"$ANALYSIS_RESULT"
              ;;
          esac
          export REQUIRED_RESULTS
          bash scripts/ci/require-ci-results.sh
