name: Auto merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: enable auto merge
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check protected main and required checks
        id: protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          protection="$(gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" 2>/dev/null || true)"
          if [[ -z "$protection" ]]; then
            echo "main is not protected; auto merge remains disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required_count="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main/protection" \
            --jq '.required_status_checks.contexts | length' 2>/dev/null || echo 0)"
          if ! [[ "$required_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "main has no required status checks; auto merge remains disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Block unreviewed CI policy changes
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          restricted=0
          if ! files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
            echo "Could not inspect changed files; auto merge remains disabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.github/dependabot.yml|scripts/*)
                echo "CI policy change requires maintainer/admin review: $path"
                restricted=1
                ;;
            esac
          done <<< "$files"
          if [[ "$restricted" -eq 1 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Dependabot metadata
        id: metadata
        if: >-
          steps.protection.outputs.enabled == 'true' &&
          steps.policy.outputs.enabled == 'true' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        with:
          github-token: ${{ github.token }}

      - name: Skip Major dependency update
        if: >-
          steps.protection.outputs.enabled == 'true' &&
          steps.policy.outputs.enabled == 'true' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major dependency updates are not auto-merged."

      - name: Enable auto merge
        if: >-
          steps.protection.outputs.enabled == 'true' &&
          steps.policy.outputs.enabled == 'true' &&
          (github.event.pull_request.user.login != 'dependabot[bot]' ||
          steps.metadata.outputs.update-type != 'version-update:semver-major')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
