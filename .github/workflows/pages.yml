# Build the wasm playground, E2E-test it, and publish to GitHub Pages.
#
# Three jobs on purpose:
#   changes  : classifies the changed paths without skipping the workflow.
#   e2e-test : builds the wasm in the CI (Ubuntu) environment, bundles RBS,
#              and runs the Playwright E2E against THAT freshly built wasm.
#              Uses the same mise tasks as local dev, and is reproducible
#              locally with `mise run ci` (= `act -j e2e-test`). We assert
#              behavior via E2E, not binary identity, so local and CI builds
#              can differ bit-for-bit.
#   deploy   : main-only, GitHub-only (needs Pages OIDC). Publishes the
#              artifact uploaded by e2e-test. Skipped under act.
#
# Build artifacts (playground/public/{tyda.wasm,rbs-bundle.json} and the Vite
# bundle in playground/dist) are produced in-job and never committed.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_pages: ${{ steps.paths.outputs.run_pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/classify-changed-paths.sh

  e2e-test:
    needs: changes
    if: needs.changes.outputs.run_pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # vendor/rbs is generated from the rbs gem by `mise run vendor-rbs`
      # (below), so a plain checkout is enough.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # clang/libclang are needed by bindgen (ruby-rbs-sys / ruby-prism-sys),
      # which runs even for the wasm target build (build-wasm.sh points it at
      # the wasi sysroot). This is the only tool mise does not provide.
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1.5.3
        with:
          packages: clang libclang-dev

      # mise installs the whole toolchain from mise.toml [tools]: rust (+rustup,
      # so this works on GitHub runners and under act alike), node, ruby, and
      # wasi-sdk. build/e2e then run via `mise run`, matching local dev. ruby is
      # build-time only; the wasm/CLI output carries no Ruby dependency.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      # The wasm build target lives in the rustup toolchain (~/.rustup), which
      # the mise cache does not cover. On a mise cache hit, mise skips rust setup
      # and the target can be missing, so add it explicitly (idempotent).
      - name: Ensure wasm target
        run: rustup target add wasm32-wasip1

      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      # Cache the bundled rbs gem so vendor-rbs doesn't refetch every run.
      # Keyed on Gemfile.lock so a version bump busts it.
      - name: Cache bundled gems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-bundle-

      # Generate vendor/rbs (stdlib RBS data) from the rbs gem. The C parser
      # itself comes from the ruby-rbs-sys crate, so this is data only; it is
      # required before the RBS bundle step and the tests that load core/stdlib.
      - name: Vendor RBS (rbs gem → vendor/rbs)
        run: mise run vendor-rbs

      # wasi-sdk is installed by mise (mise.toml [tools]); build-wasm.sh resolves
      # it via `mise where wasi-sdk`. The wasm output is host-arch-independent
      # (fixed wasm32-wasip1 target).

      # Install JS deps first: the Vite build (inside `mise run e2e`) and oxfmt
      # both run from the local install.
      # --with-deps installs the browser's OS libraries (CI containers need it).
      - name: Install deps + Playwright Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # oxfmt formats playground ts/js/json/css/html (md excluded; see .oxfmtrc.jsonc).
      - name: Check playground formatting (oxfmt)
        run: npx oxfmt --check playground

      # Builds wasm + RBS bundle + Vite (→ playground/dist) and E2Es the built
      # app via `vite preview`. Same mise task as local dev.
      - name: Build + E2E (mise run e2e)
        run: mise run e2e

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: playground/dist

  deploy:
    needs: e2e-test
    # main pushes only, and only on GitHub (deploy-pages needs Pages OIDC,
    # which act cannot provide — so this is skipped locally).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
