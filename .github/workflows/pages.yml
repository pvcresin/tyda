name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-check:
    uses: ./.github/workflows/pages-check.yml
    permissions:
      contents: read

  deploy:
    needs: pages-check
    # Main pushes only. Keep Pages deployment permissions off the reusable
    # check workflow so PR runs can execute with read-only access.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.pages-check.outputs.run_pages == 'true' &&
      needs.pages-check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
