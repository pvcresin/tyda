name: Performance

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      run_full_ci: ${{ steps.paths.outputs.run_full_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: bash scripts/ci/classify-changed-paths.sh

  build:
    name: performance-build
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.revisions.outputs.base_sha }}
      head_sha: ${{ steps.revisions.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: clang libclang-dev

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          shared-key: performance-v4

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Cache vendor/rbs
        id: cache-rbs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor/rbs
          key: ${{ runner.os }}-vendor-rbs-${{ hashFiles('Gemfile.lock') }}

      - name: Vendor RBS (rbs gem → vendor/rbs)
        if: steps.cache-rbs.outputs.cache-hit != 'true'
        run: |
          mise install ruby
          mise run vendor-rbs

      - name: Cache performance binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/performance-runtime
          key: ${{ runner.os }}-performance-runtime-${{ hashFiles('Cargo.lock', 'Gemfile.lock', 'rust-toolchain.toml') }}-${{ github.sha }}

      - name: Build base and head binaries
        env:
          TYDA_PERF_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/build_performance_binaries.sh target/performance-runtime

      - name: Export comparison revisions
        id: revisions
        shell: bash
        run: |
          metadata=target/performance-runtime/metadata.env
          base_sha="$(sed -n 's/^base_sha=//p' "$metadata")"
          head_sha="$(sed -n 's/^head_sha=//p' "$metadata")"
          test -n "$base_sha"
          test -n "$head_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Upload performance runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-runtime
          path: target/performance-runtime
          if-no-files-found: error

  performance:
    needs:
      - changes
      - build
    if: needs.changes.outputs.run_full_ci == 'true'
    name: performance (${{ matrix.subject }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          # Ruby-only subjects: small → medium.
          - subject: rack
            subject_path: subject/rack
            timeout_seconds: 60
            allow_base_timeout: "0"
          - subject: rake
            subject_path: subject/rake
            timeout_seconds: 60
            allow_base_timeout: "0"
          - subject: optcarrot
            subject_path: subject/optcarrot
            timeout_seconds: 30
            allow_base_timeout: "1"
          - subject: typeprof
            subject_path: subject/typeprof
            timeout_seconds: 120
            allow_base_timeout: "0"
          - subject: rubygems
            subject_path: subject/rubygems
            timeout_seconds: 180
            allow_base_timeout: "0"

          # Rails subjects: small → medium → large.
          - subject: conference-app
            subject_path: subject/conference-app
            timeout_seconds: 120
            allow_base_timeout: "0"
          - subject: redmine
            subject_path: subject/redmine
            timeout_seconds: 180
            allow_base_timeout: "0"
          - subject: rubygems.org
            subject_path: subject/rubygems.org
            timeout_seconds: 180
            allow_base_timeout: "0"
          - subject: mastodon
            subject_path: subject/mastodon
            timeout_seconds: 180
            allow_base_timeout: "0"
          - subject: gitlab
            subject_path: subject/gitlab/app
            timeout_seconds: 180
            allow_base_timeout: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The build job resolves the exact base/head commits; the matrix only
          # needs the current tree and the scripts.
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Download performance runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-runtime
          path: target/performance-runtime

      - name: Cache performance subject
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: subject/${{ matrix.subject }}
          key: ${{ runner.os }}-subject-${{ matrix.subject }}-${{ hashFiles('scripts/setup_subjects.sh') }}

      - name: Prepare pinned performance subject
        run: ./scripts/setup_subjects.sh "${{ matrix.subject }}"

      - name: Compare base and head performance (${{ matrix.subject }})
        env:
          TYDA_PERF_BASE_SHA: ${{ needs.build.outputs.base_sha }}
          TYDA_PERF_HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          TYDA_PERF_RUNS: ${{ github.event_name == 'pull_request' && '3' || '5' }}
          TYDA_PERF_THREADS: "2"
          TYDA_PERF_ALLOW_BASE_TIMEOUT: ${{ matrix.allow_base_timeout }}
          TYDA_PERF_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          TYDA_PERF_SUBJECT: ${{ github.workspace }}/${{ matrix.subject_path }}
          TYDA_PERF_BINARY_DIR: ${{ github.workspace }}/target/performance-runtime/bin
          TYDA_PERF_OUTPUT_DIR: ${{ github.workspace }}/target/performance/${{ matrix.subject }}
          TYDA_RBS_DIR: ${{ github.workspace }}/target/performance-runtime/vendor/rbs
        run: ./scripts/benchmark_ci.sh

      - name: Compare base and head coverage (${{ matrix.subject }})
        if: always()
        env:
          TYDA_COVERAGE_BASE_SHA: ${{ needs.build.outputs.base_sha }}
          TYDA_COVERAGE_HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          TYDA_COVERAGE_THREADS: "2"
          TYDA_COVERAGE_ALLOW_BASE_TIMEOUT: ${{ matrix.allow_base_timeout }}
          TYDA_COVERAGE_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          TYDA_COVERAGE_SUBJECT: ${{ github.workspace }}/${{ matrix.subject_path }}
          TYDA_COVERAGE_BINARY_DIR: ${{ github.workspace }}/target/performance-runtime/bin
          TYDA_COVERAGE_OUTPUT_DIR: ${{ github.workspace }}/target/coverage/${{ matrix.subject }}
          TYDA_RBS_DIR: ${{ github.workspace }}/target/performance-runtime/vendor/rbs
        run: ./scripts/coverage_ci.sh

      - name: Upload performance result (${{ matrix.subject }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-result-${{ matrix.subject }}
          path: target/performance/${{ matrix.subject }}/result.json
          if-no-files-found: ignore

      - name: Upload coverage result (${{ matrix.subject }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-result-${{ matrix.subject }}
          path: target/coverage/${{ matrix.subject }}
          if-no-files-found: ignore
