name: Pull request CI

on:
  pull_request:
    # Label events run in analysis-approval.yml, so they never re-report these gates.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# One run owns every PR check, so a new commit cancels the previous run and all
# of its reusable jobs together.
concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      run_full_ci: ${{ steps.paths.outputs.run_full_ci }}
      run_pages: ${{ steps.paths.outputs.run_pages }}
      run_analysis: ${{ steps.paths.outputs.run_analysis }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: bash scripts/ci/classify-changed-paths.sh

  test-suite:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  pages-suite:
    needs: changes
    if: needs.changes.outputs.run_pages == 'true'
    uses: ./.github/workflows/pages-check.yml
    permissions:
      contents: read

  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml
    permissions:
      contents: read

  analysis-build:
    needs: changes
    if: needs.changes.outputs.run_analysis == 'true'
    uses: ./.github/workflows/analysis-compatibility.yml
    with:
      phase: build
    permissions:
      contents: read

  performance-build:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    uses: ./.github/workflows/performance.yml
    with:
      phase: build
    permissions:
      contents: read

  test:
    name: test
    needs: [changes, test-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require test workflow
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run_full_ci }}
          REQUIRED_RESULTS: |
            test-suite=${{ needs.test-suite.result }}
        run: bash scripts/ci/require-ci-results.sh

  pages:
    name: pages
    needs: [changes, pages-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require Pages workflow
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run_pages }}
          REQUIRED_RESULTS: |
            pages-suite=${{ needs.pages-suite.result }}
        run: bash scripts/ci/require-ci-results.sh

  actionlint:
    name: actionlint
    needs: [changes, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow lint
        env:
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
        run: '[[ "$WORKFLOW_RESULT" == success ]]'

  analysis-subjects:
    needs: [changes, test, analysis-build]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_analysis == 'true' &&
      needs.test.result != 'cancelled' &&
      needs.analysis-build.result == 'success'
    uses: ./.github/workflows/analysis-compatibility.yml
    with:
      phase: subjects
    permissions:
      actions: read
      contents: read

  performance-subjects:
    needs: [changes, test, performance-build]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_full_ci == 'true' &&
      needs.test.result != 'cancelled' &&
      needs.performance-build.result == 'success'
    uses: ./.github/workflows/performance.yml
    with:
      phase: subjects
      base_sha: ${{ needs.performance-build.outputs.base_sha }}
      head_sha: ${{ needs.performance-build.outputs.head_sha }}
    permissions:
      contents: read

  vscode-package:
    needs: [changes, test]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run_full_ci == 'true' &&
      needs.test.result != 'cancelled'
    uses: ./.github/workflows/release-vscode.yml
    permissions:
      contents: read

  analysis-compatibility:
    name: analysis-compatibility
    needs: [changes, analysis-build, analysis-subjects]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require analysis workflows
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run_analysis }}
          REQUIRED_RESULTS: |
            analysis-build=${{ needs.analysis-build.result }}
            analysis-subjects=${{ needs.analysis-subjects.result }}
        run: bash scripts/ci/require-ci-results.sh
      # Subject jobs only report changes. A change passes here only when the latest
      # label run for this commit approved it, even if that run finished first.
      - name: Require approval for analysis changes
        if: >-
          needs.changes.outputs.run_analysis == 'true' &&
          needs.analysis-subjects.outputs.analysis_changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/require-analysis-approval.sh

  performance:
    name: performance
    needs: [changes, performance-build, performance-subjects]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require performance workflows
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run_full_ci }}
          REQUIRED_RESULTS: |
            performance-build=${{ needs.performance-build.result }}
            performance-subjects=${{ needs.performance-subjects.result }}
        run: bash scripts/ci/require-ci-results.sh

  release-vscode:
    name: release-vscode
    needs: [changes, vscode-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require VS Code package workflow
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run_full_ci }}
          REQUIRED_RESULTS: |
            vscode-package=${{ needs.vscode-package.result }}
        run: bash scripts/ci/require-ci-results.sh
